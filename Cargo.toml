[package]
name = "postbird"
version = "0.2.0"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
directories = "6.0"
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
html2text = "0.16"
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mime_guess = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webkit6 = { version = "0.5", features = ["v2_50"] }
